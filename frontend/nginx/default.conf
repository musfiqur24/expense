# When TLS terminates at a trusted load balancer, preserve only a valid HTTPS
# indication. This lets Express issue secure Passport session cookies behind
# the proxy while still working when NGINX itself terminates TLS.
map $http_x_forwarded_proto $expense_forwarded_proto {
    default $scheme;
    "~*^https$" https;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $expense_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
